name: cds_team
description: "CDS Team — internal workforce app for Cloud Data Solutions."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

  # Networking (dio — needed for the auth/401 interceptors)
  dio: ^5.7.0

  # Secure JWT storage (never SharedPreferences for the token)
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3

  # Device capabilities — §10 mobile check-in
  local_auth: ^2.3.0
  geolocator: ^13.0.2

  # Formatting
  intl: ^0.20.2
  printing: ^5.15.1
  image_picker: ^1.2.3
  onesignal_flutter: ^5.7.0

  # §6 2026-10-04 — opening non-image task attachments (PDF, Office, zip…)
  # with the device's own viewer.
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  firebase_core: ^4.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/cds_logo.png

# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G, which does not fit
# on an 8 GB machine and crashes the Gradle daemon with an out-of-memory error
# during Kotlin compilation. These values build comfortably here; raise them on
# a machine with more RAM.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin compiles in the Gradle process rather than spawning a second JVM,
# which would double the memory footprint.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false

# Kotlin's incremental caches are memory-mapped files; on this Windows setup
# they fail to close and break the build. Full recompiles are cheap here.
kotlin.incremental=false
